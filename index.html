<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动作预览</title>
<style>
  :root {
    --ink: #1b2440;
    --ink-soft: #4a5470;
    --cream: #f7f1e6;
    --paper: #fffdf8;
    --line: #e4dccb;
    --accent: #4b6ef5;
    --accent-soft: #e8edff;
    --shadow: 0 10px 30px rgba(27, 36, 64, .10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.5 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 90% -10%, #eef2ff 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #fdf3e6 0%, transparent 60%),
      var(--cream);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部：角色切换 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 22px;
    background: rgba(255, 253, 248, .86);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .pets { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }
  .pet {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit;
    display: flex; flex-direction: row; align-items: center; gap: 10px; line-height: 1.25;
    transition: .15s ease;
  }
  .pet small { color: var(--ink-soft); font-size: 11px; }
  .pet .avatar {
    width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
    border: 1px solid var(--line); background: #fff; flex: none;
  }
  .pet .texts { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
  .pet[aria-current="true"] .avatar { border-color: rgba(255,255,255,.7); }
  .pet:hover { border-color: #c9bfa7; transform: translateY(-1px); }
  .pet[aria-current="true"] { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: var(--shadow); }
  .pet[aria-current="true"] small { color: #c8d0e6; }
  .hint { color: var(--ink-soft); font-size: 12px; }

  /* 主体：左预览 右列表 */
  main {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
    gap: 20px;
    padding: 20px 22px 22px;
  }

  .stage {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .stage-top { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px 12px; flex-wrap: wrap; }
  .stage-top h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--ink-soft); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .meta b { color: var(--ink); font-weight: 600; }
  .badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; }

  .viewport {
    flex: 1; min-height: 260px; margin: 0 20px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background-color: #fbfaf6;
    background-image:
      linear-gradient(45deg, #efe9dc 25%, transparent 25%, transparent 75%, #efe9dc 75%),
      linear-gradient(45deg, #efe9dc 25%, transparent 25%, transparent 75%, #efe9dc 75%);
    background-size: 22px 22px;
    background-position: 0 0, 11px 11px;
    position: relative;
    overflow: hidden;
  }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .loading, .error {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--ink-soft); font-size: 13px; background: rgba(251, 250, 246, .72);
  }
  .error { color: #b0392f; }
  .hidden { display: none !important; }

  .controls { display: flex; align-items: center; gap: 12px; padding: 14px 20px 18px; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 10px; padding: 7px 14px; font: inherit; cursor: pointer;
  }
  .btn:hover { border-color: #c9bfa7; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .frame { color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 76px; text-align: right; }

  /* 右侧：分类列表 */
  .sidebar {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .search-wrap { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #search {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; background: #fff; color: var(--ink); outline: none;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .categories { overflow-y: auto; padding: 8px 10px 18px; }
  .cat { padding: 6px 6px 2px; }
  .cat > summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 6px; border-radius: 8px; font-weight: 600; color: var(--ink);
  }
  .cat > summary::-webkit-details-marker { display: none; }
  .cat > summary:hover { background: #f6f2e8; }
  .cat > summary .count { margin-left: auto; color: var(--ink-soft); font-weight: 500; font-size: 12px; }
  .cat > summary .chev { width: 8px; height: 8px; border-right: 1.6px solid var(--ink-soft); border-bottom: 1.6px solid var(--ink-soft); transform: rotate(-45deg); transition: .2s; }
  .cat[open] > summary .chev { transform: rotate(45deg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 4px 10px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
    border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
    transition: .12s ease; white-space: nowrap;
  }
  .chip:hover { border-color: #c9bfa7; color: var(--ink); transform: translateY(-1px); }
  .chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(75, 110, 245, .3); }
  .empty { color: var(--ink-soft); padding: 30px 12px; text-align: center; }

  /* 多选工具条 */
  .multi-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .multi-bar .status { color: var(--accent); font-size: 12px; width: 100%; min-height: 0; }
  .btn.mini { padding: 3px 9px; font-size: 12px; border-radius: 8px; margin-left: 6px; }
  .chip.picked { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(280px, 1fr) minmax(220px, 40%); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <nav class="pets" id="petList" aria-label="角色切换"></nav>
</header>

<main>
  <section class="stage">
    <div class="stage-top">
      <h1 id="actionName">—</h1>
      <div class="meta" id="actionMeta"></div>
    </div>
    <div class="viewport" id="viewport">
      <canvas id="view"></canvas>
      <div class="loading" id="loading">加载精灵图…</div>
      <div class="error hidden" id="error"></div>
    </div>
    <div class="controls">
      <button class="btn primary" id="playBtn" type="button">暂停</button>
      <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="帧">
      <span class="frame" id="frameLabel">0 / 0</span>
    </div>
  </section>

  <aside class="sidebar">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索动作…" autocomplete="off">
    </div>
    <div class="multi-bar">
      <button class="btn" id="selectModeBtn" type="button">多选</button>
      <button class="btn primary hidden" id="dlWebpBtn" type="button" disabled>下载 WebP</button>
      <button class="btn primary hidden" id="toWebmBtn" type="button" disabled>转 WebM (alpha)</button>
      <button class="btn hidden" id="clearSelBtn" type="button">清空</button>
      <span class="hint" id="selCount"></span>
      <span class="status hidden" id="convStatus"></span>
    </div>
    <div class="categories" id="categories"></div>
  </aside>
</main>

<script>
(() => {
  "use strict";

  const state = {
    inventory: null,
    pet: null,
    action: null,
    img: null,
    audio: null,
    playing: true,
    frame: 0,
    lastTs: 0,
    raf: 0,
    loadToken: 0,
    selectMode: false,
    selected: new Set(),
    busy: false,
  };

  const $ = (id) => document.getElementById(id);
  const view = $("view");
  const ctx = view.getContext("2d");
  const viewport = $("viewport");
  const loading = $("loading");
  const errorBox = $("error");

  // ---------- 数据 ----------
  async function loadInventory() {
    const res = await fetch("preview.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }

  // ---------- 渲染 ----------
  function renderPets() {
    const nav = $("petList");
    nav.innerHTML = "";
    state.inventory.pets.forEach((pet, index) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pet";
      btn.setAttribute("aria-current", String(pet.id === state.pet.id));
      btn.innerHTML =
        (pet.avatar ? `<img class="avatar" src="${escapeHtml(pet.avatar)}" alt="">` : "") +
        `<span class="texts"><span>${escapeHtml(pet.name)}</span><small>${pet.totalActions} 个动作</small></span>`;
      btn.addEventListener("click", () => selectPet(index));
      nav.appendChild(btn);
    });
  }

  function renderCategories() {
    const query = $("search").value.trim().toLowerCase();
    const box = $("categories");
    box.innerHTML = "";
    let shown = 0;

    state.pet.categories.forEach((cat) => {
      const actions = query
        ? cat.actions.filter((a) => a.name.toLowerCase().includes(query) || a.id.toLowerCase().includes(query))
        : cat.actions;
      if (!actions.length) return;
      shown += actions.length;

      const details = document.createElement("details");
      details.className = "cat";
      details.open = true;
      const summary = document.createElement("summary");
      summary.innerHTML = `<span class="chev"></span><span>${escapeHtml(cat.name)}</span>` +
        `<span class="count">${actions.length}${query && actions.length !== cat.count ? "/" + cat.count : ""}</span>`;
      if (state.selectMode) {
        const keys = actions.map((a) => selKey(state.pet.id, a.id));
        const allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "btn mini";
        allBtn.textContent = keys.every((k) => state.selected.has(k)) && keys.length ? "取消" : "全选";
        allBtn.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const allOn = keys.every((k) => state.selected.has(k));
          keys.forEach((k) => (allOn ? state.selected.delete(k) : state.selected.add(k)));
          renderCategories();
          updateToolbar();
        });
        summary.appendChild(allBtn);
      }
      details.appendChild(summary);

      const chips = document.createElement("div");
      chips.className = "chips";
      actions.forEach((action) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        const key = selKey(state.pet.id, action.id);
        const picked = state.selectMode && state.selected.has(key);
        chip.classList.toggle("picked", picked);
        chip.textContent = (picked ? "✓ " : "") + action.id;
        chip.title = `${action.frameCount} 帧 · ${action.columns}×${action.rows} · ${action.fps}fps`;
        chip.setAttribute("aria-current", String(!state.selectMode && state.action && state.action.id === action.id));
        chip.addEventListener("click", () => {
          if (state.selectMode) {
            state.selected.has(key) ? state.selected.delete(key) : state.selected.add(key);
            renderCategories();
            updateToolbar();
          } else {
            selectAction(action);
          }
        });
        chips.appendChild(chip);
      });
      details.appendChild(chips);
      box.appendChild(details);
    });

    if (!shown) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "没有匹配的动作";
      box.appendChild(empty);
    }
  }

  // ---------- 播放 ----------
  function selectPet(index) {
    state.pet = state.inventory.pets[index];
    renderPets();
    $("search").value = "";
    const idle = state.pet.categories.flatMap((c) => c.actions)
      .find((a) => a.id === state.pet.idleAnimationId)
      || state.pet.categories[0]?.actions[0];
    if (idle) selectAction(idle);
    else renderCategories();
  }

  function selectAction(action) {
    state.action = action;
    state.frame = 0;
    state.playing = true;
    $("playBtn").textContent = "暂停";
    $("actionName").textContent = action.name;
    $("actionMeta").innerHTML =
      `<span class="badge">${escapeHtml(action.category)}</span>` +
      `<span><b>${action.frameCount}</b> 帧</span>` +
      `<span><b>${action.columns}×${action.rows}</b> 网格</span>` +
      `<span><b>${action.frameWidth}×${action.frameHeight}</b></span>` +
      `<span><b>${action.fps}</b> fps</span>` +
      (action.audio ? `<span class="badge">有声</span>` : "");
    $("scrub").max = Math.max(0, action.frameCount - 1);
    $("scrub").value = 0;

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.setAttribute("aria-current", String(chip.textContent === action.id));
    });

    stopAudio();
    if (action.audio) {
      state.audio = new Audio(action.audio);
      state.audio.volume = 0.8;
      state.audio.play().catch(() => {});
    }

    const token = ++state.loadToken;
    showLoading(true);
    const img = new Image();
    img.decoding = "async";
    img.onload = () => {
      if (token !== state.loadToken) return;
      state.img = img;
      showLoading(false);
      resizeCanvas();
      draw();
      startLoop();
    };
    img.onerror = () => {
      if (token !== state.loadToken) return;
      showLoading(false);
      showError(`加载失败：${action.webp}`);
    };
    img.src = action.webp;
    renderCategories();
    requestAnimationFrame(() => {
      const selected = [...document.querySelectorAll(".chip")]
        .find((chip) => chip.textContent === action.id);
      if (selected) selected.scrollIntoView({ block: "nearest" });
    });
  }

  function startLoop() {
    cancelAnimationFrame(state.raf);
    state.lastTs = 0;
    const tick = (ts) => {
      state.raf = requestAnimationFrame(tick);
      if (!state.img) return;
      if (state.playing) {
        if (state.lastTs) {
          const fps = state.action.fps || 12;
          const advance = Math.floor(((ts - state.lastTs) / 1000) * fps);
          if (advance > 0) {
            state.frame = (state.frame + advance) % state.action.frameCount;
            state.lastTs += (advance / fps) * 1000;
          }
        } else {
          state.lastTs = ts;
        }
      } else {
        state.lastTs = 0;
      }
      draw();
    };
    state.raf = requestAnimationFrame(tick);
  }

  function draw() {
    const { action, img } = state;
    if (!action || !img) return;
    const w = view.clientWidth;
    const h = view.clientHeight;
    if (!w || !h) return;
    ctx.clearRect(0, 0, w, h);

    const scale = Math.min(w / action.frameWidth, h / action.frameHeight) * 0.92;
    const dw = action.frameWidth * scale;
    const dh = action.frameHeight * scale;
    const dx = (w - dw) / 2;
    const dy = (h - dh) / 2;

    const columns = action.columns || 8;
    const col = state.frame % columns;
    const row = Math.floor(state.frame / columns);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(
      img,
      col * action.frameWidth, row * action.frameHeight, action.frameWidth, action.frameHeight,
      dx, dy, dw, dh
    );

    $("frameLabel").textContent = `${state.frame + 1} / ${action.frameCount}`;
    if (document.activeElement !== $("scrub")) $("scrub").value = state.frame;
  }

  // ---------- 画布尺寸 ----------
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = viewport.getBoundingClientRect();
    view.width = Math.round(rect.width * dpr);
    view.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ---------- 交互 ----------
  function togglePlay() {
    if (!state.action) return;
    state.playing = !state.playing;
    $("playBtn").textContent = state.playing ? "暂停" : "播放";
    state.lastTs = 0;
  }

  function stepFrame(delta) {
    if (!state.action) return;
    state.frame = (state.frame + delta + state.action.frameCount) % state.action.frameCount;
    draw();
  }

  function moveAction(delta) {
    const list = state.pet.categories.flatMap((c) => c.actions);
    const index = list.findIndex((a) => a.id === state.action?.id);
    const next = list[(index + delta + list.length) % list.length];
    if (next) selectAction(next);
  }

  function showLoading(on) { loading.classList.toggle("hidden", !on); if (on) errorBox.classList.add("hidden"); }
  function showError(message) { errorBox.textContent = message; errorBox.classList.remove("hidden"); }
  function stopAudio() { if (state.audio) { state.audio.pause(); state.audio = null; } }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- 多选 / 下载 / 转换 ----------
  function selKey(petId, actionId) { return `${petId}/${actionId}`; }

  function findAction(key) {
    const [petId, actionId] = key.split("/");
    const pet = state.inventory.pets.find((p) => p.id === petId);
    const action = pet && pet.categories.flatMap((c) => c.actions).find((a) => a.id === actionId);
    return { pet, action };
  }

  function updateToolbar() {
    const n = state.selected.size;
    const show = state.selectMode && n > 0;
    $("dlWebpBtn").classList.toggle("hidden", !show);
    $("toWebmBtn").classList.toggle("hidden", !show);
    $("dlWebpBtn").disabled = !show || state.busy;
    $("toWebmBtn").disabled = !show || state.busy;
    $("selCount").textContent = state.selectMode && n ? `已选 ${n} 项` : "";
  }

  function setStatus(msg) {
    const el = $("convStatus");
    el.textContent = msg || "";
    el.classList.toggle("hidden", !msg);
  }

  function setBusy(busy) {
    state.busy = busy;
    $("dlWebpBtn").disabled = busy;
    $("toWebmBtn").disabled = busy;
    $("selectModeBtn").disabled = busy;
  }

  function saveBlob(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 30_000);
  }

  function loadImg(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(`加载失败：${src}`));
      img.src = src;
    });
  }

  async function downloadWebpSelected() {
    if (state.busy) return;
    setBusy(true);
    const keys = [...state.selected];
    try {
      const { zipSync } = await import("https://esm.sh/fflate@0.8");
      const files = {};
      for (let i = 0; i < keys.length; i++) {
        const { action } = findAction(keys[i]);
        if (!action) continue;
        setStatus(`下载 WebP ${i + 1}/${keys.length}：${action.id}`);
        const buf = new Uint8Array(await (await fetch(action.webp)).arrayBuffer());
        let name = keys[i].replace("/", "-") + ".webp";
        while (files[name]) name = name.replace(/(\.\w+)$/, `-$1`);
        files[name] = buf;
      }
      setStatus("打包 zip…");
      const zipped = zipSync(files, { level: 0 }); // webp 已压缩，仅打包不重复压缩
      saveBlob(new Blob([zipped], { type: "application/zip" }), "pets-actions-webp.zip");
      setStatus(`WebP 打包完成（${Object.keys(files).length} 个 → zip）`);
    } catch (err) {
      setStatus(`下载失败：${err.message}`);
    } finally {
      setBusy(false);
    }
  }

  async function toWebmSelected() {
    if (state.busy) return;
    setBusy(true);
    const keys = [...state.selected];
    try {
      setStatus("加载 canvas-record…");
      const { Recorder } = await import("https://esm.sh/canvas-record@6");
      const files = {};
      for (let i = 0; i < keys.length; i++) {
        const { action } = findAction(keys[i]);
        if (!action) continue;
        setStatus(`转换 WebM ${i + 1}/${keys.length}：${action.id}`);
        const img = await loadImg(action.webp);
        const canvas = document.createElement("canvas");
        canvas.width = action.frameWidth;
        canvas.height = action.frameHeight;
        const c = canvas.getContext("2d");
        const fps = action.fps || 12;
        const recorder = new Recorder(c, {
          extension: "webm",
          frameRate: fps,
          duration: Infinity, // 手动逐帧，转完调 stop()
          encoderOptions: { alpha: "keep" },
        });
        const columns = action.columns || 8;
        const drawFrame = (f) => {
          c.clearRect(0, 0, canvas.width, canvas.height);
          c.drawImage(
            img,
            (f % columns) * action.frameWidth, Math.floor(f / columns) * action.frameHeight,
            action.frameWidth, action.frameHeight,
            0, 0, canvas.width, canvas.height
          );
        };
        await recorder.start({ initOnly: true });
        for (let f = 0; f < action.frameCount; f++) {
          drawFrame(f);
          await recorder.step();
        }
        const buffer = await recorder.stop();
        await recorder.dispose();
        const blob = new Blob(Array.isArray(buffer) ? buffer : [buffer], { type: "video/webm" });
        let name = keys[i].replace("/", "-") + ".webm";
        while (files[name]) name = name.replace(/(\.\w+)$/, `-$1`);
        files[name] = new Uint8Array(await blob.arrayBuffer());
      }
      setStatus("打包 zip…");
      const { zipSync } = await import("https://esm.sh/fflate@0.8");
      const zipped = zipSync(files, { level: 0 });
      saveBlob(new Blob([zipped], { type: "application/zip" }), "pets-actions-webm.zip");
      setStatus(`WebM 转换完成（${Object.keys(files).length} 个 → zip）`);
    } catch (err) {
      setStatus(`转换失败：${err.message}`);
    } finally {
      setBusy(false);
    }
  }

  $("selectModeBtn").addEventListener("click", () => {
    state.selectMode = !state.selectMode;
    if (!state.selectMode) { state.selected.clear(); setStatus(""); }
    $("selectModeBtn").textContent = state.selectMode ? "退出多选" : "多选";
    $("clearSelBtn").classList.toggle("hidden", !state.selectMode);
    updateToolbar();
    renderCategories();
  });
  $("clearSelBtn").addEventListener("click", () => { state.selected.clear(); renderCategories(); updateToolbar(); });
  $("dlWebpBtn").addEventListener("click", downloadWebpSelected);
  $("toWebmBtn").addEventListener("click", toWebmSelected);

  $("playBtn").addEventListener("click", togglePlay);
  $("scrub").addEventListener("input", (event) => {
    if (!state.action) return;
    state.frame = Number(event.target.value);
    draw();
  });
  $("search").addEventListener("input", renderCategories);

  window.addEventListener("keydown", (event) => {
    if (event.target.tagName === "INPUT") return;
    if (event.code === "Space") { event.preventDefault(); togglePlay(); }
    if (event.key === "ArrowLeft") stepFrame(-1);
    if (event.key === "ArrowRight") stepFrame(1);
    if (event.key === "ArrowUp") moveAction(-1);
    if (event.key === "ArrowDown") moveAction(1);
  });

  new ResizeObserver(() => resizeCanvas()).observe(viewport);

  // ---------- 启动 ----------
  loadInventory()
    .then((inventory) => {
      state.inventory = inventory;
      selectPet(0);
    })
    .catch((err) => {
      showLoading(false);
      showError(`无法读取清单：${err.message}。请用本地服务器打开（python3 -m http.server）。`);
    });
})();
</script>
</body>
</html>
